<!doctype html><html lang="en"><head><title>TrajDali</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96"><link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg"><link rel="shortcut icon" href="/favicon/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png"><link rel="manifest" href="/favicon/site.webmanifest"><style>body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}nav{position:absolute;top:0;height:10vh;width:calc(100% - 10vw);display:flex;justify-content:space-between;padding:0 5%;z-index:1000}nav #logo{max-height:150%;margin-top:.75rem;flex:1;max-width:calc(100% - 35px)}nav .links{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:clamp(1.5rem,6vw,6rem)}nav .links a{text-decoration:none;color:inherit;font-size:clamp(1.25rem, .5rem + 1vw, 2rem);padding:.25rem 0}#logo img{max-height:150%}.burger-menu{display:none;flex-direction:column;justify-content:space-between;width:30px;height:21px;cursor:pointer;z-index:1001;margin-top:5vh}.burger-menu span{display:block;width:100%;height:3px;background-color:#231f20;transition:all .3s ease}.mobile-menu{display:none;position:fixed;top:0;left:0;width:100%;height:100vh;background-color:#fff;z-index:999;padding:10vh 2rem;box-sizing:border-box}.mobile-menu .links{display:flex;flex-direction:column;align-items:center;gap:2rem;margin-top:2rem}.mobile-menu .links a{font-size:2rem;text-decoration:none;color:inherit}.mobile-menu.active{display:block}.burger-menu.active span:first-child{transform:translateY(9px) rotate(45deg)}.burger-menu.active span:nth-child(2){opacity:0}.burger-menu.active span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}@keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes fade-out{from{opacity:1}to{opacity:0}}@keyframes slide-from-right{from{transform:translateX(100px)}to{transform:translateX(0)}}@keyframes slide-to-left{from{transform:translateX(0)}to{transform:translateX(-100px)}}@keyframes scale-up{from{transform:scale(1)}to{transform:scale(1.5)}}@keyframes scale-down{from{transform:scale(1.5)}to{transform:scale(1)}}::view-transition-old(cover-image){animation:.8s cubic-bezier(.4,0,.2,1) both fade-out,.8s cubic-bezier(.4,0,.2,1) both slide-to-left,.8s cubic-bezier(.4,0,.2,1) both scale-down}::view-transition-new(cover-image){animation:.8s cubic-bezier(.4,0,.2,1) both fade-in,.8s cubic-bezier(.4,0,.2,1) both slide-from-right,.8s cubic-bezier(.4,0,.2,1) both scale-up}::view-transition-old(mix-thumbnail){animation:.8s cubic-bezier(.4,0,.2,1) both fade-out,.8s cubic-bezier(.4,0,.2,1) both slide-to-left,.8s cubic-bezier(.4,0,.2,1) both scale-down}::view-transition-new(mix-thumbnail){animation:.8s cubic-bezier(.4,0,.2,1) both fade-in,.8s cubic-bezier(.4,0,.2,1) both slide-from-right,.8s cubic-bezier(.4,0,.2,1) both scale-up}body,html{padding:0;margin:0;font-family:'Roboto Condensed',sans-serif;color:#231f20}section{height:80vh;padding:10vh;scroll-snap-align:start;min-block-size:80vh;scroll-snap-stop:always}section .content{width:100%;height:100%;display:flex;align-items:center;justify-content:center}#hero .hero-image{background-image:url(./background.jpg);background-image:-webkit-image-set(
                url("./images/background-1200.jpg") 1x,
                url("./images/background-1920.jpg") 2x
            );background-image:image-set(
                url("./images/background-1200.jpg") 1x,
                url("./images/background-1920.jpg") 2x
            );background-size:cover;background-position:75% 35%;background-repeat:no-repeat;width:100%;height:100%}#hero .hero-image img,#hero .hero-image picture{width:100%;height:100%}@media screen and (max-width:900px){body,html{overflow-x:hidden}nav .links{display:none}.burger-menu{display:flex}}@media screen and (max-width:480px){#hero .hero-image{background-position:70% 35%;background-image:-webkit-image-set(
                    url("./images/background-480.jpg") 1x,
                    url("./images/background-1200.jpg") 2x
                );background-image:image-set(
                    url("./images/background-480.jpg") 1x,
                    url("./images/background-1200.jpg") 2x
                )}nav{width:90%}}</style></head><body><nav><div id="logo"><a href="/"><img src="/logo.svg" alt="Logo"></a></div><div class="links"><a href="/music">Music</a> <a href="/mixes">Mixes</a> <a href="/contact">Contact</a></div><div class="burger-menu"><span></span> <span></span> <span></span></div></nav><div class="mobile-menu"><div class="links"><a href="/music">Music</a> <a href="/mixes">Mixes</a> <a href="/contact">Contact</a></div></div><section id="hero"><div class="hero-image"></div></section><script>const burgerMenu=document.querySelector(".burger-menu"),mobileMenu=document.querySelector(".mobile-menu");burgerMenu.addEventListener("click",()=>{burgerMenu.classList.toggle("active"),mobileMenu.classList.toggle("active")}),document.querySelectorAll(".mobile-menu a").forEach(e=>{e.addEventListener("click",()=>{burgerMenu.classList.remove("active"),mobileMenu.classList.remove("active")})}),document.startViewTransition&&document.addEventListener("click",async e=>{if(!e.target.closest("a"))return;e.preventDefault();const t=e.target.closest("a").href,n=document.startViewTransition(async()=>{window.location.href=t});await n.finished})</script></body></html>
